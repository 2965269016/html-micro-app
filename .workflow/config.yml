# =============================================================================
#  HTML 微应用容器 · Gitee Go 云打包流水线
#  文档: https://gitee.com/help/articles/4356
#
#  触发条件：push 到 main / master 分支
#  产物：    app-debug.apk 自动上传到 Gitee Release
#
#  ⚠️ 需要配置的全局变量（仓库 → 流水线 → 设置 → 全局变量）：
#     名称: CI_TOKEN
#     值:   你的 Gitee 私人令牌（需勾选 projects 权限）
#     获取: https://gitee.com/profile/personal_access_tokens
#     未配置也能构建成功，只是不会自动发布 Release
# =============================================================================
version: '1.0'
name: html-micro-app-build
displayName: 'HTML微应用容器 · 云打包'

triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main
        - master

variables:
  global:
    - CI_TOKEN

stages:
  - name: build_and_publish
    displayName: '构建并发布 APK'
    strategy: fast
    trigger: auto
    executor: []
    steps:
      # ── 单步完成：装工具链 → Gradle 构建 → 发布 Release ─────────────────
      # 使用 run@shell 在 Ubuntu 22.04 容器中执行
      # ci/build_and_publish.sh 内部自行处理 JDK / Android SDK / Gradle / 构建 / 发布
      - step: run@shell
        name: build_and_publish
        displayName: '构建并发布 APK'
        image: ubuntu:22.04
        commands:
          - apt-get update -qq
          - apt-get install -y -qq curl unzip zip git
          - bash ci/build_and_publish.sh
        # 把 APK 也存为流水线制品，Release 发布失败时仍可从这里下载
        artifacts:
          - name: APK_ARTIFACT
            path:
              - app/build/outputs/apk/debug/app-debug.apk
        strategy:
          retry: '0'
          stepTimeout: 90
